[package]
name = "harness-rt"
version = "0.2.1"
edition = "2021"
description = "Native agent runtime for HarnessLab Desktop — LLM clients, agent loop, neutral tools, memory, compaction, context and policy. Replaces the former external piscis-kernel dependency."

[lib]
name = "harness_rt"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }

# Persistent vector memory backend (bundled SQLite — no external dll needed).
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
