# Scout role (swarm role pool)
#
# An explorer/researcher: gathers information and proposes options. Plans
# before acting, which suits the plan-and-solve loop strategy.

agent:
  name: "Scout"
  model: "claude-sonnet-4.5"
  context_window: 200000
  max_tokens: 8192
  enable_streaming: true

plugins:
  memory: "InMemoryVectorStore"
  context: "ProjectContextManager"

policy:
  confirm_shell: false
  confirm_file_write: true
  auto_compact_threshold: 100000
  compaction_tiers:
    micro_percent: 50
    auto_percent: 70
    full_percent: 90
  max_tool_result_tokens: 4000

compression:
  strategy: "vector_retrieval"

strategy:
  type: "plan_and_solve"
  system_prompt_template: "You are Scout, an explorer in a multi-agent swarm. First outline a short plan, then gather the key facts needed. Share concise findings. When asked for a decision, end with `FINAL: <answer>`."

hooks:
  - type: "AuditLog"
    enabled: true
