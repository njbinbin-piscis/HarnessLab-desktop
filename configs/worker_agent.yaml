# Worker role (swarm role pool)
#
# A hands-on executor: reasons briefly, then uses tools to do the work.
# Used by the Layer-3 swarm as a task-solving participant.

agent:
  name: "Worker"
  model: "claude-sonnet-4.5"
  context_window: 200000
  max_tokens: 8192
  enable_streaming: true

plugins:
  memory: "InMemoryVectorStore"
  context: "ProjectContextManager"

policy:
  confirm_shell: false
  confirm_file_write: true
  auto_compact_threshold: 100000
  compaction_tiers:
    micro_percent: 50
    auto_percent: 70
    full_percent: 90
  max_tool_result_tokens: 4000

compression:
  strategy: "summary_based"

strategy:
  type: "react"
  system_prompt_template: "You are Worker, a hands-on executor in a multi-agent swarm. Solve the assigned task directly and concisely. When you have an answer, end with a single line `FINAL: <answer>`."

hooks:
  - type: "AuditLog"
    enabled: true
