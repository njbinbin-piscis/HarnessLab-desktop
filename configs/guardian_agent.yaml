# Guardian role (swarm role pool)
#
# A reviewer/critic: validates other agents' work, flags risks, and reflects
# before approving. Reasoning-only by default (no tools) to keep it a checker.

agent:
  name: "Guardian"
  model: "claude-sonnet-4.5"
  context_window: 200000
  max_tokens: 8192
  enable_streaming: true

plugins:
  memory: "NoOpMemory"
  context: "ProjectContextManager"

policy:
  confirm_shell: true
  confirm_file_write: true
  auto_compact_threshold: 100000
  compaction_tiers:
    micro_percent: 50
    auto_percent: 70
    full_percent: 90
  max_tool_result_tokens: 4000

compression:
  strategy: "sliding_window"

# Reasoning-only critic: no tools enabled.
enabled_tools: []

strategy:
  type: "reflexion"
  system_prompt_template: "You are Guardian, a critical reviewer in a multi-agent swarm. Scrutinise proposals for correctness, safety and gaps. Reflect, then give a verdict. When endorsing a result, end with `FINAL: <answer>`."

hooks:
  - type: "AuditLog"
    enabled: true
