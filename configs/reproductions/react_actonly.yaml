# ReAct ablation — Arm A: Act-only (Yao et al., 2023)
#
# Ablates the "Thought" channel from ReAct: the agent may only emit Actions.
# Same model / tools / token budget as react_hotpotqa.yaml — the ONLY difference
# is the system prompt that suppresses reasoning traces. Expected: lower
# exact-match / F1 on HotpotQA vs. full ReAct (paper Table 1).

agent:
  name: "ActOnly-HotpotQA"
  model: "qwen-max"
  context_window: 32000
  max_tokens: 1024
  fallback_models:
    - "gpt-4o"
  enable_streaming: false

plugins:
  memory: "NoOpMemory"
  context: "WorkspaceRootManager"

policy:
  confirm_shell: false
  confirm_file_write: false
  auto_compact_threshold: 0
  compaction_tiers:
    micro_percent: 50
    auto_percent: 70
    full_percent: 90
  max_tool_result_tokens: 2000

strategy:
  type: "react"
  system_prompt_template: |
    Solve a question answering task using ONLY Actions (no reasoning).
    Each step must be exactly one of:
      Action: web_search[<query>]
      Action: finish[<answer>]
    Do NOT output any "Thought:" lines. Retrieve evidence, then finish.

hooks:
  - type: "AuditLog"
    level: "info"
