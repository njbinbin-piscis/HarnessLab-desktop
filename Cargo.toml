[package]
name = "agent-workbench"
version = "0.1.0"
edition = "2021"
description = "Agent Workbench - Configuration-driven agent experimentation platform"

[dependencies]
# Pin matches openpiscis / AgentZ workspace (tag v0.8.42 on piscis-engine).
piscis-kernel = { git = "https://github.com/njbinbin-piscis/piscis-engine.git", package = "piscis-kernel", rev = "v0.8.42" }

# Local engine hacking — uncomment and comment out the git dep above:
# [patch."https://github.com/njbinbin-piscis/piscis-engine.git"]
# piscis-kernel = { path = "../piscis-engine/piscis-kernel" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "config_loader"
path = "tests/benchmark/config_loader.rs"

[[test]]
name = "benchmark_runner"
path = "tests/benchmark/runner.rs"

[[test]]
name = "config_validation"
path = "tests/benchmark/config_validation.rs"

[[test]]
name = "phase3_validation"
path = "tests/benchmark/phase3_validation.rs"
