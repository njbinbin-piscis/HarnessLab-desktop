# HarnessLab Desktop — Cargo workspace.
#
# Members:
#   crates/harnesslab-core  — project model / ops / registry / experiment /
#                             factory / design / market logic + headless CLI.
#   src-tauri               — the Tauri v2 desktop shell (commands + events).
#
# The agent runtime is consumed from the standalone `piscis-engine` repo as a
# git dependency (rev pinned below, shared with openpiscis / AgentZ). For local
# engine hacking, add a `[patch."https://github.com/njbinbin-piscis/piscis-engine.git"]`
# section pointing the crates at a sibling `../piscis-engine` checkout.
[workspace]
members = ["crates/harnesslab-core", "src-tauri"]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
needless_return = "allow"
module_inception = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

# Shared agent runtime — pin rev across openpiscis, AgentZ, agent-workbench (v0.8.47).
piscis-kernel = { git = "https://github.com/njbinbin-piscis/piscis-engine.git", package = "piscis-kernel", rev = "v0.8.47" }

# Local engine hacking — uncomment and comment out the git dep above:
# [patch."https://github.com/njbinbin-piscis/piscis-engine.git"]
# piscis-kernel = { path = "../piscis-engine/piscis-kernel" }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
