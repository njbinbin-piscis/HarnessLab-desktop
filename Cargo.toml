# HarnessLab Desktop — Cargo workspace.
#
# Members:
#   crates/harness-rt       — native agent runtime (LLM clients, agent loop,
#                             tools, memory, compaction, context, policy).
#   crates/harnesslab-core  — project model / ops / registry / experiment /
#                             factory / design / market logic + headless CLI.
#   src-tauri               — the Tauri v2 desktop shell (commands + events).
#
# The agent runtime is now owned in-tree (crates/harness-rt); the workbench no
# longer depends on the external `piscis-engine` repo.
[workspace]
members = ["crates/harnesslab-core", "crates/harness-rt", "src-tauri"]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
needless_return = "allow"
module_inception = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }

# Native agent runtime — replaces the former external `piscis-kernel` git dep.
# Lives in-tree at crates/harness-rt so the workbench owns its kernel.
harness-rt = { path = "crates/harness-rt" }

# HTTP client for the native LLM clients + neutral network tools.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
