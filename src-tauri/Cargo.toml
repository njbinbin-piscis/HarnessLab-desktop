[package]
name = "harnesslab-desktop"
version = "0.1.0"
description = "HarnessLab Desktop — a Tauri v2 desktop app to design, run and ship multi-agent harnesses."
authors = ["HarnessLab"]
license = "MIT"
edition = "2021"
default-run = "harnesslab-desktop"

[lib]
name = "harnesslab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "harnesslab-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
harnesslab-core = { path = "../crates/harnesslab-core" }
piscis-kernel = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

# SQLite (bundled - no external dll needed) for the local project/run store.
rusqlite = { version = "0.31", features = ["bundled"] }

[lints]
workspace = true
